listen:
  host: "0.0.0.0"
  port: "8765"
token: "replace-with-a-long-random-token"
update_interval: 1s
services:
  - nginx.service
  - sshd.service
docker: false
tls:
  cert_file: ""
  key_file: ""
custom_metrics:
  minecraft_players:
    command:
      - "/usr/local/bin/get-player-count"
    interval: 5s
    timeout: 2s
    max_output_bytes: 65536
